name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned third-party sources
        run: ./scripts/fetch_third_party.sh

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSTRATAKV_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizer:
    name: ubuntu-24.04 / ASan+UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned third-party sources
        run: ./scripts/fetch_third_party.sh

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DSTRATAKV_BUILD_TESTS=ON
          -DSTRATAKV_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    name: ubuntu-24.04 / Python bindings (Phase D)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned third-party sources
        run: ./scripts/fetch_third_party.sh

      - name: Install pytest
        run: python3 -m pip install --user pytest

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSTRATAKV_BUILD_TESTS=ON
          -DSTRATAKV_PYTHON=ON

      - name: Build
        run: cmake --build build

      - name: Test (C++ unit + Python engine suite)
        run: ctest --test-dir build --output-on-failure
